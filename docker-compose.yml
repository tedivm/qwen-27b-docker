services:
  qwen38:
    # Uncomment to use prebuilt image.
    #image: ghcr.io/tedivm/qwen-27b-docker:latest
    build:
      context: .
    container_name: qwen38
    runtime: nvidia
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_DOWNLOAD=1
      - HF_XET_HIGH_PERFORMANCE=1
      # Defaults from Dockerfile — uncomment to override:
      # - PORT=1234
      # - SERVED_MODEL_NAME=qwen3.8-27b
      # - MAX_MODEL_LEN=250000
      # - MAX_NUM_SEQS=3
      # - MAX_NUM_BATCHED_TOKENS=8192
      # - GPU_MEMORY_UTIL=0.92
      # - NUM_SPECULATIVE_TOKENS=3
      # - KV_CACHE_DTYPE=fp8
      # - TEMPERATURE=0.6
      # - TOP_P=0.95
      # - TOP_K=20
      # - MIN_P=0.0
      # - PRESENCE_PENALTY=0
      # - REPETITION_PENALTY=1.0
      # - REASONING_PARSER=qwen3
      # - TOOL_CALL_PARSER=qwen3_coder
      # - AUTO_TOOL_CHOICE=1
      # - VLLM_ALLREDUCE_USE_FLASHINFER=0
      # - PER_REQUEST_SPEC_DECODE=none
      # - PERFORMANCE_MODE=interactivity
      # - GDN_PREFILL_BACKEND=triton
      # - KDA_PREFILL_BACKEND=
      # - KDA_DECODE_BACKEND=flashinfer
      # OpenTelemetry — uncomment to enable tracing/metrics/logs:
      # - OTEL_SERVICE_NAME=vllm-qwen38
      # - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=grpc://192.168.4.108:4317
      # - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=grpc://192.168.4.108:4317
      # - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=grpc://192.168.4.108:4317
      # - OTEL_EXPORTER_OTLP_INSECURE=true
      # Chat template defaults to the built in. To change uncomment:
      # - CHAT_TEMPLATE=/usr/local/bin/qwen3.8-froggeric.jinja
      # - CHAT_TEMPLATE_PRESERVE_THINKING=true
      # - CHAT_TEMPLATE_ENABLE_THINKING=true

    shm_size: 1g
    volumes:
      - ./models:/data/models
      - ./logs:/data/logs
    ports:
      - "1234:1234"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
